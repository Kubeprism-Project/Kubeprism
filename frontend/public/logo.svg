<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="roundedCorners">
      <rect width="400" height="400" rx="32"/>
    </clipPath>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#060d18"/>
    </radialGradient>

    <!-- Glow filters -->
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Face gradients -->
    <linearGradient id="faceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565c0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d47a1" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0288d1" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#01579b" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Tout le contenu clipé aux coins arrondis -->
  <g clip-path="url(#roundedCorners)">

  <!-- Background sombre -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Stars -->
  <g opacity="0.7">
    <circle cx="40"  cy="35"  r="1"   fill="white" opacity="0.6"/>
    <circle cx="85"  cy="70"  r="0.8" fill="white" opacity="0.4"/>
    <circle cx="130" cy="28"  r="1.2" fill="white" opacity="0.7"/>
    <circle cx="310" cy="45"  r="0.9" fill="white" opacity="0.5"/>
    <circle cx="360" cy="80"  r="1"   fill="white" opacity="0.6"/>
    <circle cx="345" cy="30"  r="0.7" fill="white" opacity="0.4"/>
    <circle cx="55"  cy="320" r="1.1" fill="white" opacity="0.5"/>
    <circle cx="28"  cy="270" r="0.8" fill="white" opacity="0.3"/>
    <circle cx="370" cy="340" r="1"   fill="white" opacity="0.6"/>
    <circle cx="380" cy="280" r="0.7" fill="white" opacity="0.4"/>
    <circle cx="160" cy="355" r="0.9" fill="white" opacity="0.5"/>
    <circle cx="240" cy="375" r="1"   fill="white" opacity="0.4"/>
    <circle cx="100" cy="160" r="0.6" fill="white" opacity="0.3"/>
    <circle cx="320" cy="200" r="0.8" fill="white" opacity="0.4"/>
  </g>

  <!-- Ambient glow behind cube -->
  <ellipse cx="200" cy="210" rx="90" ry="60" fill="#1e88e5" opacity="0.08" filter="url(#glowSoft)"/>

  <!-- ==================== ISOMETRIC CUBE ==================== -->
  <!-- Cube center: 200,200 — half-width: 90 — projected at 30deg isometric -->
  <!-- Top face: diamond shape -->
  <!-- Points: top(200,128), right(278,172), bottom(200,216), left(122,172) -->
  <polygon
    points="200,128 278,172 200,216 122,172"
    fill="url(#faceTop)"
    stroke="#4fc3f7"
    stroke-width="1.5"
    filter="url(#glowBlue)"
  />

  <!-- Left face -->
  <!-- Points: left(122,172), bottom-top(200,216), bottom(200,304), left-bottom(122,260) -->
  <polygon
    points="122,172 200,216 200,304 122,260"
    fill="url(#faceLeft)"
    stroke="#5c9fd4"
    stroke-width="1.5"
    filter="url(#glowBlue)"
  />

  <!-- Right face -->
  <!-- Points: right(278,172), bottom-top(200,216), bottom(200,304), right-bottom(278,260) -->
  <polygon
    points="278,172 200,216 200,304 278,260"
    fill="url(#faceRight)"
    stroke="#3d7ab5"
    stroke-width="1.5"
    filter="url(#glowBlue)"
  />

  <!-- Cube edges with glow -->
  <g filter="url(#glowCyan)" stroke="#4fc3f7" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Top face edges -->
    <line x1="200" y1="128" x2="278" y2="172"/>
    <line x1="278" y1="172" x2="200" y2="216"/>
    <line x1="200" y1="216" x2="122" y2="172"/>
    <line x1="122" y1="172" x2="200" y2="128"/>
    <!-- Vertical edges -->
    <line x1="200" y1="216" x2="200" y2="304"/>
    <line x1="122" y1="172" x2="122" y2="260"/>
    <line x1="278" y1="172" x2="278" y2="260"/>
    <!-- Bottom face visible edges -->
    <line x1="122" y1="260" x2="200" y2="304"/>
    <line x1="278" y1="260" x2="200" y2="304"/>
  </g>

  <!-- Bright corner vertices -->
  <g filter="url(#glowCyan)">
    <circle cx="200" cy="128" r="3" fill="#80d8ff"/>
    <circle cx="278" cy="172" r="2.5" fill="#4fc3f7"/>
    <circle cx="122" cy="172" r="2.5" fill="#4fc3f7"/>
    <circle cx="200" cy="216" r="3" fill="#80d8ff"/>
    <circle cx="200" cy="304" r="2.5" fill="#4fc3f7"/>
    <circle cx="122" cy="260" r="2"   fill="#29b6f6"/>
    <circle cx="278" cy="260" r="2"   fill="#29b6f6"/>
  </g>

  <!-- "K" letter on the left face -->
  <g filter="url(#glowCyan)" transform="translate(138, 220) skewY(26.5) scale(0.85,1)">
    <text
      x="0" y="0"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700"
      font-size="52"
      fill="#4fc3f7"
      opacity="0.85"
      letter-spacing="-2"
    >K</text>
  </g>

  <!-- "P" letter on the right face -->
  <g filter="url(#glowBlue)" transform="translate(208, 220) skewY(-26.5) scale(0.85,1)">
    <text
      x="0" y="0"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700"
      font-size="52"
      fill="#1e88e5"
      opacity="0.75"
      letter-spacing="-2"
    >P</text>
  </g>

  <!-- "KUBEPRISM" text -->
  <text
    x="200" y="358"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="22"
    fill="#4fc3f7"
    text-anchor="middle"
    letter-spacing="8"
    filter="url(#glowBlue)"
    opacity="0.9"
  >KUBEPRISM</text>

  <!-- Subtle tagline -->
  <text
    x="200" y="380"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="10"
    fill="#4fc3f7"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.4"
  >3D KUBERNETES VISUALIZATION</text>

  </g>
</svg>
